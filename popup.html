<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fafafa; }
    h3 { margin-top: 0; color: #333; text-align: center; }
    label { display: block; margin-bottom: 5px; font-size: 13px; color: #666; }
    input[type="number"] { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px;}
    button:hover { background-color: #1976D2; }
    #stopBtn { background-color: #f44336; display: none; }
    #stopBtn:hover { background-color: #d32f2f; }
    textarea { width: 100%; height: 120px; margin-top: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; font-size: 12px;}
    #status { margin-top: 10px; font-size: 13px; color: #555; text-align: center; font-weight: 500;}
  </style>
</head>
<body>
  <h3>Fotor Auto Register</h3>
  
  <label for="targetCount">Số lượng tài khoản muốn tạo</label>
  <input type="number" id="targetCount" value="1" min="1" max="1000">

  <label for="emailProvider">Nguồn Email tạm</label>
  <select id="emailProvider" style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:13px;">
    <option value="imail">iMail.edu.vn</option>
    <option value="tempmailo">Temp-Mailo.org (TMail)</option>
  </select>

  <label for="targetUrl">Link Đăng Ký (Link Ref) cố định</label>
  <input type="text" id="targetUrl" value="https://www.fotor.com/events/get-credits/?referrerCode=" placeholder="https://www.fotor.com/...">
  
  <button id="startBtn">Bắt đầu Đăng ký</button>
  <button id="resumeBtn" style="display:none; background-color:#27ae60;">▶️ Tiếp tục (đã đổi IP)</button>
  <button id="stopBtn">Dừng lại</button>
  <button id="rotateVpnBtn" style="background-color:#9b59b6;">🔄 Đổi IP ngay (OpenVPN)</button>

  <div id="vpnStatus" style="font-size:11px; color:#9b59b6; margin:4px 0; min-height:14px; text-align:center;"></div>
  <div id="refUsageInfo" style="font-size:11px; color:#e67e22; margin:6px 0; min-height:14px;"></div>
  <div id="status">Đang chờ...</div>

  <details style="margin-top:10px; border:1px solid #ddd; border-radius:4px; padding:8px; background:#fff;">
    <summary style="cursor:pointer; font-weight:bold; font-size:12px; color:#0088cc;">⚙️ Cấu hình Telegram Bot (lưu acc + cảnh báo Captcha)</summary>
    <div style="margin-top:8px;">
      <label style="font-size:11px;">Bot Token (từ @BotFather):</label>
      <input type="text" id="tgBotToken" placeholder="123456:ABC-DEF..." style="width:100%; padding:6px; margin-bottom:6px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:11px;">
      <label style="font-size:11px;">Chat ID (từ @userinfobot):</label>
      <input type="text" id="tgChatId" placeholder="123456789" style="width:100%; padding:6px; margin-bottom:6px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box; font-size:11px;">
      <label style="font-size:11px;">
        <input type="checkbox" id="tgEnabled" style="vertical-align:middle;">
        Bật gửi Telegram (alert + lưu acc)
      </label>
      <button id="tgSaveBtn" style="margin-top:6px; padding:6px; background-color:#0088cc; font-size:12px;">💾 Lưu cấu hình</button>
      <button id="tgTestBtn" style="margin-top:4px; padding:6px; background-color:#7f8c8d; font-size:12px;">📤 Gửi tin nhắn test</button>
      <div id="tgStatus" style="margin-top:6px; font-size:11px; color:#666;"></div>
    </div>
  </details>

  <label for="successList" style="margin-top: 10px;">Danh sách tài khoản thành công:</label>
  <textarea id="successList" readonly placeholder="Trống"></textarea>
  <button id="downloadBtn" style="margin-top:10px; padding: 6px; width: 100%; border-radius: 4px; border: 1px solid #1a73e8; background: #e8f0fe; color: #1a73e8; cursor: pointer; font-weight: bold;">⬇️ Xuất File TXT Tài Khoản</button>

  <script src="popup.js"></script>
</body>
</html>
